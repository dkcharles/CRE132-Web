name: Deploy web front-end

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'engine/**'
      - 'content/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # A broken build must never reach the site.
      - name: Build
        run: dotnet build web/CRE132.Web --nologo

      - name: Run the tests
        run: dotnet test engine/Tests --nologo

      # Build MUST run before Publish: wwwroot/refs/*.bin are generated during build, and
      # wwwroot content is evaluated at project-evaluation time - a clean single-shot publish
      # would ship without them.
      - name: Publish
        run: dotnet publish web/CRE132.Web -c Release -o publish --nologo

      # This is a project page, so the app is served from /CRE132-Web/, not /.
      # Source keeps <base href="/" /> so local `dotnet run` works;
      # DeployContractTests pins the exact string this sed targets.
      - name: Rewrite base href
        run: sed -i 's|<base href="/" />|<base href="/CRE132-Web/" />|' publish/wwwroot/index.html && grep -q '<base href="/CRE132-Web/" />' publish/wwwroot/index.html

      # 404.html is the SPA fallback: Pages serves it for any deep link, and it bounces to
      # document.baseURI. That resolves through the SAME base href, so it needs the SAME
      # rewrite - without it, a deep link lands on the domain root instead of /CRE132-Web/.
      - name: Rewrite base href in the 404 fallback
        run: sed -i 's|<base href="/" />|<base href="/CRE132-Web/" />|' publish/wwwroot/404.html && grep -q '<base href="/CRE132-Web/" />' publish/wwwroot/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
