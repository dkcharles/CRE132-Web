<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRE132</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="lib/codemirror/codemirror.min.css" />
    <link rel="stylesheet" href="lib/codemirror/material-darker.min.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>
    <div id="app">
        <p id="loading">Loading CRE132&hellip;</p>
    </div>

    <div id="blazor-error-ui">
        Something went wrong and CRE132 could not start.
        Reload the page; if it keeps happening, the browser may be blocking WebAssembly.
        <a href="" class="reload">Reload</a>
    </div>

    <script src="lib/codemirror/codemirror.min.js"></script>
    <script src="lib/codemirror/clike.min.js"></script>
    <!-- The other half of 404.html: Pages served that file for a deep link, it stashed the
         real URL and bounced here, and this puts the URL back before Blazor reads it. Must
         run BEFORE blazor.webassembly.js. -->
    <script>(function(){try{var r=sessionStorage.redirect; if(r){delete sessionStorage.redirect; history.replaceState(null,'',r);}}catch(e){}})();</script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
